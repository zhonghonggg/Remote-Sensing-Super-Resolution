name: Complete offline release assets
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: geosr-v1-initial-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.10'
          architecture: x64
      - name: Verify draft and reuse the validated installer
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $releaseRecord=gh api "repos/$env:GH_REPO/releases/441337866" | ConvertFrom-Json
          if ($LASTEXITCODE -or !$releaseRecord.draft) { throw 'Expected the initial draft release' }
          New-Item -ItemType Directory -Force release | Out-Null
          gh release download v1.0.0 --pattern GeoSR-1.0.0-Windows-x64-Setup.exe --dir release
          if ($LASTEXITCODE) { throw 'Installer download failed' }
          $installerHash=(Get-FileHash -LiteralPath release/GeoSR-1.0.0-Windows-x64-Setup.exe -Algorithm SHA256).Hash.ToLower()
          if ($installerHash -ne '88d6490c59c61407a25e1a4a3b65dc92202fe3c2903b97b7ad356d9ada836a60') { throw 'Installer digest mismatch' }
      - name: Collect offline build dependencies
        shell: pwsh
        run: |
          python -m pip download -r requirements-lock.txt -d wheelhouse
          if ($LASTEXITCODE) { throw 'Dependency download failed' }
          gh release download is-6_7_4 --repo jrsoftware/issrc --pattern innosetup-6.7.4.exe --dir vendor
          if ($LASTEXITCODE) { throw 'Inno Setup download failed' }
          Move-Item -LiteralPath vendor/innosetup-6.7.4.exe -Destination vendor/innosetup.exe
          $compilerHash=(Get-FileHash -LiteralPath vendor/innosetup.exe -Algorithm SHA256).Hash.ToLower()
          if ($compilerHash -ne 'a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c') { throw 'Compiler digest mismatch' }
      - name: Package complete source and calculate checksums
        shell: pwsh
        run: |
          python package_source.py --public
          if ($LASTEXITCODE) { throw 'Source archive verification failed' }
      - name: Upload source and checksum assets
        shell: pwsh
        run: |
          gh release upload v1.0.0 release/GeoSR-1.0.0-Full-Source.zip release/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE) { throw 'Release asset upload failed' }
      - name: Verify all assets and publish
        shell: pwsh
        run: |
          $remoteAssets=gh api "repos/$env:GH_REPO/releases/441337866/assets" | ConvertFrom-Json
          if ($LASTEXITCODE) { throw 'Asset query failed' }
          foreach ($releaseName in @('GeoSR-1.0.0-Windows-x64-Setup.exe','GeoSR-1.0.0-Full-Source.zip','SHA256SUMS.txt')) {
            $localAsset=Get-Item -LiteralPath (Join-Path release $releaseName)
            $remoteAsset=$remoteAssets | Where-Object name -eq $releaseName
            $localDigest='sha256:'+(Get-FileHash -LiteralPath $localAsset.FullName -Algorithm SHA256).Hash.ToLower()
            if (!$remoteAsset -or $remoteAsset.state -ne 'uploaded' -or $remoteAsset.size -ne $localAsset.Length -or $remoteAsset.digest -ne $localDigest) { throw "Asset verification failed: $releaseName" }
          }
          gh release edit v1.0.0 --draft=false --latest
          if ($LASTEXITCODE) { throw 'Release publication failed' }
          "Published: https://github.com/$env:GH_REPO/releases/tag/v1.0.0" >> $env:GITHUB_STEP_SUMMARY
