name: Build and publish V1.1
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: geosr-v1.1-publication
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: v1.1.0
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.10'
          architecture: x64
      - name: Install locked build dependencies
        shell: pwsh
        run: |
          python -m pip download -r requirements-lock.txt -d wheelhouse
          if ($LASTEXITCODE) { throw 'Dependency download failed' }
          python -m pip install --no-index --find-links wheelhouse -r requirements-lock.txt
          if ($LASTEXITCODE) { throw 'Dependency install failed' }
      - name: Validate processing, batch queue and update notes
        shell: pwsh
        run: |
          foreach ($testFile in @('tests/acceptance.py','tests/edge_cases.py','tests/directory_batch.py','tests/updates_once.py')) {
            python $testFile --cpu-only
            if ($LASTEXITCODE) { throw "Test failed: $testFile" }
          }
      - name: Build and test frozen program
        shell: pwsh
        run: |
          python collect_licenses.py
          if ($LASTEXITCODE) { throw 'License collection failed' }
          python -m PyInstaller --noconfirm GeoSR.spec
          if ($LASTEXITCODE) { throw 'Application build failed' }
          python tests/package_smoke.py
          if ($LASTEXITCODE) { throw 'Packaged processing/OVR test failed' }
      - name: Build installer and complete offline source
        shell: pwsh
        run: |
          gh release download is-6_7_4 --repo jrsoftware/issrc --pattern innosetup-6.7.4.exe --dir vendor
          if ($LASTEXITCODE) { throw 'Compiler download failed' }
          Move-Item -LiteralPath vendor/innosetup-6.7.4.exe -Destination vendor/innosetup.exe
          $compilerHash=(Get-FileHash -LiteralPath vendor/innosetup.exe -Algorithm SHA256).Hash.ToLower()
          if ($compilerHash -ne 'a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c') { throw 'Compiler digest mismatch' }
          $compiler=Get-ChildItem -Path "${env:ProgramFiles(x86)}/Inno Setup*/ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$compiler) {
            $compilerDir=Join-Path $env:RUNNER_TEMP GeoSR-Inno
            $setup=Start-Process -FilePath (Resolve-Path vendor/innosetup.exe).Path -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/NOICONS',('/DIR="'+$compilerDir+'"') -WindowStyle Hidden -Wait -PassThru
            if ($setup.ExitCode) { throw 'Compiler install failed' }
            $compiler=Get-Item -LiteralPath (Join-Path $compilerDir ISCC.exe)
          }
          & $compiler.FullName /Q installer.iss
          if ($LASTEXITCODE) { throw 'Installer compilation failed' }
          python package_source.py --public
          if ($LASTEXITCODE) { throw 'Source archive verification failed' }
      - name: Upload verified assets and publish release
        shell: pwsh
        run: |
          $existing=gh api "repos/$env:GH_REPO/releases/tags/$env:RELEASE_TAG" 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (!(($existing | ConvertFrom-Json).draft)) { throw 'This version is already public' }
          } else {
            gh release create $env:RELEASE_TAG --target $env:GITHUB_SHA --title '遥感影像超分辨率工具 V1.1' --notes-file RELEASE_NOTES.md --draft
            if ($LASTEXITCODE) { throw 'Draft creation failed' }
          }
          gh release upload $env:RELEASE_TAG release/GeoSR-1.1.0-Windows-x64-Setup.exe release/GeoSR-1.1.0-Full-Source.zip release/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE) { throw 'Asset upload failed' }
          $record=gh api "repos/$env:GH_REPO/releases/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          if ($LASTEXITCODE) { throw 'Release query failed' }
          foreach ($name in @('GeoSR-1.1.0-Windows-x64-Setup.exe','GeoSR-1.1.0-Full-Source.zip','SHA256SUMS.txt')) {
            $local=Get-Item -LiteralPath (Join-Path release $name)
            $remote=$record.assets | Where-Object name -eq $name
            $digest='sha256:'+(Get-FileHash -LiteralPath $local.FullName -Algorithm SHA256).Hash.ToLower()
            if (!$remote -or $remote.state -ne 'uploaded' -or $remote.size -ne $local.Length -or $remote.digest -ne $digest) { throw "Asset verification failed: $name" }
          }
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE) { throw 'Publication failed' }
          "Published V1.1: https://github.com/$env:GH_REPO/releases/tag/$env:RELEASE_TAG" >> $env:GITHUB_STEP_SUMMARY
